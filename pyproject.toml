[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pihole-manager"
version = "0.2.0"
description = "Desktop manager for Pi-hole v6 with optional LLM-assisted domain review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
desktop-notifications = ["plyer>=2.1"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
pihole-manager = "pihole_manager.__main__:main"

[tool.setuptools.packages.find]
include = ["pihole_manager*", "pihole6api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
