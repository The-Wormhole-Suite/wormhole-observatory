[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pihole-manager"
version = "0.3.6"
description = "Desktop manager for Pi-hole v6 with optional LLM-assisted domain review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "dnspython>=2.6,<3",
  "cryptography>=48.0.1,<49",
  "keyring>=25,<26",
  "pywebpush>=2.4,<3",
]

[project.optional-dependencies]
desktop-notifications = ["plyer>=2.1"]
dev = ["pytest>=8", "ruff>=0.9", "PyYAML==6.0.3"]
build = ["pyinstaller>=6,<7"]
windows-build = ["pyinstaller>=6,<7"]

[project.scripts]
pihole-manager-cli = "pihole_manager.__main__:main"
wormhole-observatory-headless = "pihole_manager.headless:main"

[project.gui-scripts]
pihole-manager = "pihole_manager.__main__:main"

[tool.setuptools.packages.find]
include = ["pihole_manager*", "pihole6api*"]

[tool.setuptools.package-data]
pihole_manager = ["data/*.json", "data/*.pem", "webapp/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
