name: Development build cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Create exact v0.3.7 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="e2fdf7fcc6a92c924de3d1fe72e865575142b891"
          if gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.3.7" >tag.json 2>/dev/null; then
            existing="$(jq -r '.object.sha' tag.json)"
            if [ "$existing" != "$target" ]; then
              echo "v0.3.7 already exists at unexpected SHA: $existing" >&2
              exit 1
            fi
            echo "v0.3.7 already points at the gated SHA"
            exit 0
          fi
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v0.3.7' \
            -f sha="$target"
