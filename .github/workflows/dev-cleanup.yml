name: Development build cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Create exact v0.3.6 tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: e140f687566f5c83869df7bb194d3db4b9982fdc
          TAG_NAME: v0.3.6
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" != "$EXPECTED_SHA" ]; then
            echo "main moved: expected $EXPECTED_SHA, got $main_sha" >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/tmp/tag.json 2>/dev/null; then
            tag_sha="$(jq -r '.object.sha' /tmp/tag.json)"
            if [ "$tag_sha" != "$EXPECTED_SHA" ]; then
              echo "${TAG_NAME} already exists at unexpected SHA ${tag_sha}" >&2
              exit 1
            fi
            echo "${TAG_NAME} already points to ${EXPECTED_SHA}"
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG_NAME}" \
            -f sha="$EXPECTED_SHA" >/tmp/created-tag.json
          tag_sha="$(jq -r '.object.sha' /tmp/created-tag.json)"
          if [ "$tag_sha" != "$EXPECTED_SHA" ]; then
            echo "Created tag points to unexpected SHA ${tag_sha}" >&2
            exit 1
          fi
          echo "Created ${TAG_NAME} at ${EXPECTED_SHA}"
