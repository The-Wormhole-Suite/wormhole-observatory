name: Development build cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  published-release-smoke:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: e140f687566f5c83869df7bb194d3db4b9982fdc
      EXPECTED_IMAGE_DIGEST: sha256:c499b14a9f0e20e2482bbb48630ceb7393d8b9e664dc55e91783f7a6b2829ed0
      IMAGE: ghcr.io/the-wormhole-suite/wormhole-observatory
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify published GitHub release and download assets
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.3.6")"
          test "$(jq -r .target_commitish <<<"$release")" = "$EXPECTED_SHA"
          test "$(jq -r .name <<<"$release")" = "Wormhole Observatory v0.3.6"
          test "$(jq -r .draft <<<"$release")" = "false"
          test "$(jq -r .prerelease <<<"$release")" = "false"
          mkdir published
          cd published
          gh release download v0.3.6 --repo "$GITHUB_REPOSITORY"
          test -f Pi-Hole-Manager-linux-x64.zip
          test -f Pi-Hole-Manager-linux-x64.zip.sha256
          test -f Pi-Hole-Manager-windows-x64.zip
          test -f Pi-Hole-Manager-windows-x64.zip.sha256
          sha256sum -c Pi-Hole-Manager-linux-x64.zip.sha256
          sha256sum -c Pi-Hole-Manager-windows-x64.zip.sha256

      - name: Verify published desktop artifact contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir linux windows
          unzip -q published/Pi-Hole-Manager-linux-x64.zip -d linux
          unzip -q published/Pi-Hole-Manager-windows-x64.zip -d windows
          for root in linux/Pi-Hole-Manager windows/Pi-Hole-Manager; do
            for file in LICENSE NOTICE TRADEMARKS.md UPSTREAMS.md THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt; do
              test -s "$root/$file"
            done
            grep -q 'Copyright 2025 Shane Barbetta' "$root/THIRD_PARTY_NOTICES.md"
            grep -q 'Wormhole Observatory third-party license bundle' "$root/THIRD_PARTY_LICENSES.txt"
          done
          test -x linux/Pi-Hole-Manager/Pi-Hole-Manager
          test -f windows/Pi-Hole-Manager/Pi-Hole-Manager.exe
          linux_manifest="$(find linux/Pi-Hole-Manager -name install_manifest.json -print -quit)"
          windows_manifest="$(find windows/Pi-Hole-Manager -name install_manifest.json -print -quit)"
          test -n "$linux_manifest"
          test -n "$windows_manifest"
          test "$(jq -r .version "$linux_manifest")" = "0.3.6"
          test "$(jq -r .version "$windows_manifest")" = "0.3.6"
          test "$(jq -r .platform "$linux_manifest")" = "linux"
          test "$(jq -r .platform "$windows_manifest")" = "windows"
          test "$(jq -r .build_id "$linux_manifest")" = "$EXPECTED_SHA"
          test "$(jq -r .build_id "$windows_manifest")" = "$EXPECTED_SHA"

      - name: Smoke-start published Linux desktop binary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          set +e
          timeout 8s xvfb-run -a linux/Pi-Hole-Manager/Pi-Hole-Manager >linux-start.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat linux-start.log >&2
            exit "$code"
          fi
          if [ "$code" -eq 0 ]; then
            echo "Published Linux desktop binary exited cleanly during smoke window."
          else
            echo "Published Linux desktop binary remained alive for the smoke window."
          fi

      - name: Verify published GHCR tags and metadata
        shell: bash
        run: |
          set -euo pipefail
          for tag in 0.3.6 0.3 latest sha-e140f687566f5c83869df7bb194d3db4b9982fdc; do
            inspect="$(docker buildx imagetools inspect "$IMAGE:$tag")"
            digest="$(awk '/^Digest:/ {print $2; exit}' <<<"$inspect")"
            test "$digest" = "$EXPECTED_IMAGE_DIGEST"
          done
          docker pull --platform linux/amd64 "$IMAGE:0.3.6"
          revision="$(docker image inspect "$IMAGE:0.3.6" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          source="$(docker image inspect "$IMAGE:0.3.6" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          echo "OCI revision=$revision"
          echo "OCI source=$source"
          test "$source" = "https://github.com/The-Wormhole-Suite/wormhole-observatory"
          if [ "$revision" != "$EXPECTED_SHA" ]; then
            echo "OCI revision mismatch: expected $EXPECTED_SHA, got $revision" >&2
            exit 42
          fi
