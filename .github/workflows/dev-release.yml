name: Development release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PIHOLE_MANAGER_BUILD_CHANNEL: prerelease
      PIHOLE_MANAGER_BUILD_ID: ${{ github.sha }}
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Windows reproducibility pass 1
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        run: ./build_windows.ps1
      - name: Linux reproducibility pass 1
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        run: ./build_linux.sh

      - name: Windows reproducibility pass 2
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        run: ./build_windows.ps1
      - name: Linux reproducibility pass 2
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        run: ./build_linux.sh

      - name: Verify byte-for-byte reproducibility
        run: python scripts/verify_reproducible_release.py release-pass1 release-pass2

      - name: Generate portable release provenance
        env:
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python scripts/generate_release_provenance.py release-pass1

      - name: Sign and verify release archive with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: release-pass1/*.zip
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Sign and verify release provenance with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: release-pass1/*.intoto.json
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Publish GitHub artifact attestation when available
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: release-pass1/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-release
          path: release-pass1/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::8}"
          tag="dev-${GITHUB_RUN_NUMBER}-${short_sha}"
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development build ${short_sha}" \
            --notes "Automated reproducible, signed and attested Onedir build from dev at commit ${GITHUB_SHA}."
