name: Development release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PIHOLE_MANAGER_BUILD_CHANNEL: prerelease
      PIHOLE_MANAGER_BUILD_ID: ${{ github.sha }}
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Windows reproducibility pass 1
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        run: ./build_windows.ps1
      - name: Linux reproducibility pass 1
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        run: ./build_linux.sh

      - name: Windows reproducibility pass 2
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        run: ./build_windows.ps1
      - name: Linux reproducibility pass 2
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        run: ./build_linux.sh

      - name: Verify byte-for-byte reproducibility
        run: python scripts/verify_reproducible_release.py release-pass1 release-pass2
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-release
          path: release-pass1/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::8}"
          tag="dev-${GITHUB_RUN_NUMBER}-${short_sha}"
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development build ${short_sha}" \
            --notes "Automated reproducible Onedir build from dev at commit ${GITHUB_SHA}."
