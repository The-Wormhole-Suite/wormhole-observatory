name: Development release

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/dev-release.yml"
      - "Pi-Hole-Manager.spec"
      - "build_release.py"
      - "build_linux.sh"
      - "build_windows.ps1"
      - "requirements-build.lock"
      - "pyproject.toml"
      - "pihole_manager/**"
      - "pihole6api/**"
      - "scripts/generate_release_provenance.py"
      - "scripts/verify_reproducible_release.py"
  workflow_dispatch:

concurrency:
  group: development-release
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PIHOLE_MANAGER_BUILD_CHANNEL: prerelease
      PIHOLE_MANAGER_BUILD_ID: ${{ github.sha }}
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Windows reproducibility pass 1
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        run: ./build_windows.ps1
      - name: Linux reproducibility pass 1
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        run: ./build_linux.sh

      - name: Windows reproducibility pass 2
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        run: ./build_windows.ps1
      - name: Linux reproducibility pass 2
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        run: ./build_linux.sh

      - name: Verify byte-for-byte reproducibility
        run: python scripts/verify_reproducible_release.py release-pass1 release-pass2

      - name: Generate portable release provenance
        env:
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python -m pihole_manager.release_provenance release-pass1

      - name: Sign and verify release archive with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: release-pass1/*.zip
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Sign and verify release provenance with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: release-pass1/*.intoto.json
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Publish GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: release-pass1/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-release
          path: release-pass1/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::8}"
          tag="dev-${GITHUB_RUN_NUMBER}-${short_sha}"
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development build ${short_sha}" \
            --notes "Automated reproducible, signed and attested Onedir build from dev at commit ${GITHUB_SHA}."
      - name: Clean expired development prereleases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEV_RETENTION_DAYS: "30"
          DEV_RETENTION_KEEP: "10"
        run: python scripts/cleanup_dev_builds.py --releases-only
