name: Finalize source import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct validated source tree
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import subprocess
          import tarfile

          parts = sorted(pathlib.Path('.bootstrap').glob('*.part'))
          if not parts:
              raise SystemExit('No bootstrap parts found')

          encoded = ''.join(part.read_text(encoding='ascii').strip() for part in parts)
          archive = pathlib.Path('/tmp/pihole-manager-source.tar.gz')
          archive.write_bytes(base64.b64decode(encoded, validate=True))

          root = pathlib.Path('.').resolve()
          with tarfile.open(archive, 'r:gz') as bundle:
              for member in bundle.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f'Unsafe archive member: {member.name}')

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode('utf-8'))
              if path.is_file() or path.is_symlink():
                  path.unlink()

          with tarfile.open(archive, 'r:gz') as bundle:
              bundle.extractall('.')
          PY
      - name: Publish reconstructed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add domain intelligence, research and protected entries"
            git push origin HEAD:main
          fi
