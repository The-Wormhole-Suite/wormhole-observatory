name: Provider registry review

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: provider-registry-review
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Validate registry
        run: python scripts/provider_registry.py validate pihole_manager/data/provider_registry.json
      - name: Check source review age
        id: stale
        continue-on-error: true
        shell: bash
        run: |
          python scripts/provider_registry.py stale \
            pihole_manager/data/provider_registry.json \
            --max-age-days 35 | tee provider-registry-review.txt
      - name: Open or update review issue
        if: steps.stale.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Provider registry review required"
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file provider-registry-review.txt
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file provider-registry-review.txt
          fi
      - name: Close completed review issue
        if: steps.stale.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Provider registry review required"
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "All registry entries are within the review window."
          fi
