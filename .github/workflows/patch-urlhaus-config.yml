name: Patch URLhaus config

on:
  push:
    branches:
      - codex/urlhaus-auth-20260820
    paths:
      - .github/workflows/patch-urlhaus-config.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/urlhaus-auth-20260820
          fetch-depth: 0
      - name: Patch config
        shell: python
        run: |
          from pathlib import Path

          path = Path("pihole_manager/config.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          if not any('kind="urlhaus"' in line for line in lines):
              kind_matches = [
                  index
                  for index, line in enumerate(lines)
                  if line == '                kind="repository_lists",\n'
              ]
              if len(kind_matches) != 1:
                  raise SystemExit(
                      f"Expected one repository-list provider kind, found {len(kind_matches)}"
                  )
              kind_index = kind_matches[0]
              start = kind_index
              while start >= 0 and lines[start] != "            ResearchProviderOptions(\n":
                  start -= 1
              end = kind_index
              while end < len(lines) and lines[end] != "            ),\n":
                  end += 1
              if start < 0 or end >= len(lines):
                  raise SystemExit("Could not locate repository-list provider block boundaries")
              provider_lines = [
                  "            ResearchProviderOptions(\n",
                  '                name="URLhaus host lookup",\n',
                  '                kind="urlhaus",\n',
                  "                enabled=False,\n",
                  '                base_url="https://urlhaus-api.abuse.ch/v1",\n',
                  "                min_interval_sec=1.0,\n",
                  "                refresh_interval_hours=6,\n",
                  "                max_results=5,\n",
                  '                test_domain="example.com",\n',
                  "            ),\n",
              ]
              lines[end + 1 : end + 1] = provider_lines

          supported_indices = [
              index
              for index, line in enumerate(lines)
              if line == '        "repository_lists",\n'
          ]
          already_registered = [
              index for index, line in enumerate(lines) if line == '        "urlhaus",\n'
          ]
          if not already_registered:
              if len(supported_indices) != 2:
                  raise SystemExit(
                      f"Expected two supported-kind anchors, found {len(supported_indices)}"
                  )
              for index in reversed(supported_indices):
                  lines.insert(index + 1, '        "urlhaus",\n')
          elif len(already_registered) != 2:
              raise SystemExit(
                  f"Expected zero or two URLhaus supported-kind entries, found {len(already_registered)}"
              )

          path.write_text("".join(lines), encoding="utf-8")
      - name: Verify syntax and integration
        run: |
          python -m py_compile pihole_manager/config.py
          python - <<'PY'
          from pihole_manager.config import Options
          providers = [item for item in Options().research_providers if item.kind == "urlhaus"]
          assert len(providers) == 1
          assert providers[0].enabled is False
          assert providers[0].base_url == "https://urlhaus-api.abuse.ch/v1"
          PY
      - name: Commit config patch
        run: |
          if git diff --quiet -- pihole_manager/config.py; then
            echo "Config already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pihole_manager/config.py
          git commit -m "Register URLhaus research provider"
          git push origin HEAD:codex/urlhaus-auth-20260820
