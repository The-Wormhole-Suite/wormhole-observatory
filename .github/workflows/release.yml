name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PIHOLE_MANAGER_BUILD_CHANNEL: ${{ contains(github.ref_name, '-') && 'prerelease' || 'stable' }}
      PIHOLE_MANAGER_BUILD_ID: ${{ github.sha }}
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
      - name: Build reproducibility pass 1
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        shell: ${{ matrix.platform == 'windows' && 'pwsh' || 'bash' }}
        run: ${{ matrix.platform == 'windows' && './build_windows.ps1' || './build_linux.sh' }}
      - name: Build reproducibility pass 2
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        shell: ${{ matrix.platform == 'windows' && 'pwsh' || 'bash' }}
        run: ${{ matrix.platform == 'windows' && './build_windows.ps1' || './build_linux.sh' }}
      - name: Verify byte-for-byte reproducibility
        run: python scripts/verify_reproducible_release.py release-pass1 release-pass2
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-release
          path: release-pass1/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            $prerelease \
            --generate-notes \
            --title "Pi-hole Manager ${GITHUB_REF_NAME}"
