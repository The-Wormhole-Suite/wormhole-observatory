name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Pi-Hole-Manager.spec"
      - "build_release.py"
      - "build_linux.sh"
      - "build_windows.ps1"
      - "requirements-build.lock"
      - "pyproject.toml"
      - "pihole_manager/release_provenance.py"
      - "scripts/generate_release_provenance.py"
      - "scripts/verify_reproducible_release.py"

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PIHOLE_MANAGER_BUILD_CHANNEL: ${{ contains(github.ref_name, '-') && 'prerelease' || 'stable' }}
      PIHOLE_MANAGER_BUILD_ID: ${{ github.sha }}
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Windows reproducibility pass 1
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        run: ./build_windows.ps1
      - name: Linux reproducibility pass 1
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass1
        run: ./build_linux.sh

      - name: Windows reproducibility pass 2
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        run: ./build_windows.ps1
      - name: Linux reproducibility pass 2
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PIHOLE_MANAGER_RELEASE_DIR: release-pass2
        run: ./build_linux.sh

      - name: Verify byte-for-byte reproducibility
        run: python scripts/verify_reproducible_release.py release-pass1 release-pass2

      - name: Generate portable release provenance
        env:
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python -m pihole_manager.release_provenance release-pass1

      - name: Sign and verify release archive with Sigstore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: release-pass1/*.zip
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Sign and verify release provenance with Sigstore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: release-pass1/*.intoto.json
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Publish GitHub artifact attestation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: release-pass1/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-release
          path: release-pass1/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            $prerelease \
            --generate-notes \
            --title "Pi-hole Manager ${GITHUB_REF_NAME}"
