name: CI

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  integrate-external-trigger:
    if: github.ref == 'refs/heads/codex/llm-analysis-profiles-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply external trigger patches
        shell: bash
        run: |
          set -o pipefail
          {
            set -x
            for patch in \
              .github/external-trigger-config.patch \
              .github/external-trigger-credentials.patch \
              .github/external-trigger-settings.patch \
              .github/external-trigger-app.patch \
              .github/external-trigger-example.patch \
              .github/external-trigger-readme.patch \
              .github/external-trigger-module.patch \
              .github/external-trigger-tests.patch \
              .github/external-trigger-config-tests.patch
            do
              git apply --check --verbose "$patch"
              git apply --verbose "$patch"
            done
          } 2>&1 | tee /tmp/external-trigger-apply.log

      - name: Install and validate full repository
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          {
            echo '== compile =='
            python -m compileall -q pihole6api pihole_manager tests
            echo '== ruff =='
            ruff check .
            echo '== pytest =='
            pytest
          } 2>&1 | tee /tmp/external-trigger-ci.log

      - name: Mark Priority 1 complete and commit
        shell: bash
        run: |
          set -o pipefail
          {
            set -x
            python - <<'PY'
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          old = '- optional authenticated external trigger adapter for scheduled or MCP-driven review jobs'
          new = '- [x] optional authenticated external trigger adapter for scheduled or MCP-driven review jobs'
          if old not in text and new not in text:
              raise SystemExit('external trigger roadmap item not found')
          path.write_text(text.replace(old, new, 1))
          PY
            git checkout HEAD -- .github/workflows/ci.yml
            rm -f .github/external-trigger*.patch
            rm -f .github/external-trigger*.b64
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git status --short
            git diff --cached --check
            git commit -m 'Add authenticated external review trigger'
            git push
          } 2>&1 | tee /tmp/external-trigger-finalize.log

      - name: Publish failure diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### External trigger integration failure'
            echo
            echo '```text'
            if [ -f /tmp/external-trigger-apply.log ]; then
              tail -n 200 /tmp/external-trigger-apply.log
            fi
            if [ -f /tmp/external-trigger-ci.log ]; then
              tail -n 200 /tmp/external-trigger-ci.log
            fi
            if [ -f /tmp/external-trigger-finalize.log ]; then
              tail -n 200 /tmp/external-trigger-finalize.log
            fi
            echo '```'
          } > /tmp/external-trigger-comment.md
          gh pr comment 2 --body-file /tmp/external-trigger-comment.md
