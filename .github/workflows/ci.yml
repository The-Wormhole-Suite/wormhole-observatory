name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Repository integrity
        if: matrix.python-version == '3.12'
        run: python scripts/check_repository_integrity.py
      - name: Ruff
        if: matrix.python-version == '3.12'
        run: ruff check .
      - name: Tkinter GUI startup smoke
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb-run is required for the Linux GUI startup smoke test" >&2
            exit 1
          fi
          log_file="$(mktemp)"
          set +e
          timeout --signal=TERM 8s xvfb-run -a python app.py >"$log_file" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            exit 0
          fi
          cat "$log_file"
          echo "GUI exited before the startup smoke window completed (status=$status)" >&2
          exit 1
      - run: pytest
