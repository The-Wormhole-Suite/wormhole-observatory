name: Container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "repository.yaml"
      - "wormhole_observatory/**"
      - "pyproject.toml"
      - "pihole_manager/**"
      - "pihole6api/**"
  push:
    branches: [dev]
    tags: ["v*"]

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/the-wormhole-suite/wormhole-observatory

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Determine pull-request multi-architecture scope
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$files" | grep -Eq \
            '^(\.github/workflows/container\.yml|\.dockerignore|Dockerfile|compose\.yaml|repository\.yaml|wormhole_observatory/|pyproject\.toml|pihole_manager/container_entrypoint\.py)'; then
            echo "multiarch=true" >> "$GITHUB_OUTPUT"
          else
            echo "multiarch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native smoke image
        run: docker build --tag wormhole-observatory:smoke .

      - name: Smoke-test headless service, persistence, and Home Assistant bootstrap
        shell: bash
        run: |
          set -euo pipefail
          volume="wormhole-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="wormhole-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container" 2>/dev/null || true
            docker rm -f "$container" 2>/dev/null || true
            docker volume rm "$volume" 2>/dev/null || true
          }
          wait_health() {
            local token="$1"
            for _ in $(seq 1 30); do
              if curl -fsS \
                -H "Authorization: Bearer ${token}" \
                http://127.0.0.1:18765/health >/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          assert_runtime_uid() {
            local uid
            uid="$(docker exec "$container" cat /proc/1/status | awk '/^Uid:/ {print $2}')"
            test "$uid" = "10001"
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null

          docker run -d --name "$container" \
            -e WORMHOLE_API_TOKEN=container-smoke-token \
            -e WORMHOLE_ACCESS_MODE=any \
            -p 18765:8765 \
            -v "$volume:/data" \
            wormhole-observatory:smoke >/dev/null
          wait_health container-smoke-token
          assert_runtime_uid
          curl -fsS http://127.0.0.1:18765/app/ | grep -q 'Wormhole Observatory'
          docker rm -f "$container" >/dev/null

          docker run --rm \
            --entrypoint python \
            -v "$volume:/data" \
            wormhole-observatory:smoke \
            -c "from pathlib import Path; assert Path('/data/wormhole/pihole_manager.sqlite3').is_file(); assert Path('/data/wormhole/options.json').is_file()"

          docker run -d --name "$container" \
            -e WORMHOLE_API_TOKEN=container-smoke-token \
            -e WORMHOLE_ACCESS_MODE=any \
            -p 18765:8765 \
            -v "$volume:/data" \
            wormhole-observatory:smoke >/dev/null
          wait_health container-smoke-token
          assert_runtime_uid
          docker rm -f "$container" >/dev/null

          docker run --rm \
            --entrypoint python \
            -v "$volume:/data" \
            wormhole-observatory:smoke \
            -c "import json,os; path='/data/options.json'; open(path,'w',encoding='utf-8').write(json.dumps({'api_token':'home-assistant-smoke-token','access_mode':'any','max_domains':37})); os.chmod(path,0o600)"
          docker run -d --name "$container" \
            -p 18765:8765 \
            -v "$volume:/data" \
            wormhole-observatory:smoke >/dev/null
          wait_health home-assistant-smoke-token
          assert_runtime_uid
          curl -fsS \
            -H 'Authorization: Bearer home-assistant-smoke-token' \
            http://127.0.0.1:18765/v1/status >/dev/null

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.scope.outputs.multiarch == 'true')
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.scope.outputs.multiarch == 'true')
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Verify multi-architecture build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.scope.outputs.multiarch == 'true')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Clean expired development container versions
        if: github.ref == 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEV_RETENTION_DAYS: "30"
          DEV_RETENTION_KEEP: "10"
        run: python3 scripts/cleanup_dev_builds.py --packages-only
