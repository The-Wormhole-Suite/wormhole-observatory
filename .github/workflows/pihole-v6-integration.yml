name: Pi-hole v6 integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"
  pull_request:
    paths:
      - "pihole6api/**"
      - "pihole_manager/pihole_*.py"
      - "pihole_manager/config.py"
      - "pihole_manager/credentials.py"
      - "pihole_manager/http_retry.py"
      - "tests/integration/**"
      - "pyproject.toml"
      - ".github/workflows/pihole-v6-integration.yml"
  push:
    branches:
      - main
      - dev
      - codex/roadmap-audit-20260819
    paths:
      - "pihole6api/**"
      - "pihole_manager/pihole_*.py"
      - "pihole_manager/config.py"
      - "pihole_manager/credentials.py"
      - "pihole_manager/http_retry.py"
      - "tests/integration/**"
      - "pyproject.toml"
      - ".github/workflows/pihole-v6-integration.yml"

concurrency:
  group: pihole-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: FTL ${{ matrix.ftl }} / Docker ${{ matrix.image_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"image_tag":"2026.05.0","ftl":"6.6"}]}' || '{"include":[{"image_tag":"2025.10.0","ftl":"6.3"},{"image_tag":"2026.02.0","ftl":"6.5"},{"image_tag":"2026.05.0","ftl":"6.6"}]}') }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Start Pi-hole ${{ matrix.image_tag }}
        run: |
          docker run -d \
            --name pihole-integration \
            -e TZ=UTC \
            -e FTLCONF_webserver_api_password=wormhole-ci-secret \
            -e FTLCONF_dns_listeningMode=ALL \
            -p 127.0.0.1:8080:80 \
            pihole/pihole:${{ matrix.image_tag }}

      - name: Wait for authenticated API
        run: |
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data '{"password":"wormhole-ci-secret"}' \
              http://127.0.0.1:8080/api/auth \
              | python -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("session", {}).get("valid") else 1)' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs pihole-integration
            exit 1
          fi

      - name: Run Observatory integration contract
        env:
          PIHOLE_INTEGRATION_URL: http://127.0.0.1:8080
          PIHOLE_INTEGRATION_PASSWORD: wormhole-ci-secret
          PIHOLE_EXPECTED_FTL_MINOR: ${{ matrix.ftl }}
        run: pytest tests/integration/test_pihole_v6.py -q

      - name: Show container logs on failure
        if: failure()
        run: docker logs pihole-integration

      - name: Stop container
        if: always()
        run: docker rm -f pihole-integration || true
