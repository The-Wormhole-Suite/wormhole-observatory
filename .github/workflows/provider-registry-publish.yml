name: Publish provider registry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag that receives the reviewed registry assets
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    environment: provider-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Validate reviewed registry
        run: python scripts/provider_registry.py validate pihole_manager/data/provider_registry.json
      - name: Require the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          latest_tag="$(gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName')"
          if [ "$RELEASE_TAG" != "$latest_tag" ]; then
            echo "Registry assets must be attached to the latest release: $latest_tag" >&2
            exit 1
          fi
      - name: Sign registry
        env:
          PROVIDER_REGISTRY_ED25519_PRIVATE_KEY: ${{ secrets.PROVIDER_REGISTRY_ED25519_PRIVATE_KEY }}
        run: |
          python scripts/provider_registry.py sign \
            pihole_manager/data/provider_registry.json \
            provider-registry.json.sig
      - name: Verify signature
        run: |
          python scripts/provider_registry.py verify \
            pihole_manager/data/provider_registry.json \
            provider-registry.json.sig \
            pihole_manager/data/provider_registry_public_key.pem
      - name: Publish reviewed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pihole_manager/data/provider_registry.json provider-registry.json
          gh release upload "${{ inputs.release_tag }}" \
            provider-registry.json \
            provider-registry.json.sig \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
