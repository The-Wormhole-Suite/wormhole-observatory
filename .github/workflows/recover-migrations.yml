name: Recover migration work

on:
  push:
    branches:
      - codex/llm-analysis-profiles-20260731

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last good database files
        run: |
          git checkout e927b5eea2739306ddf3b97e60152e458fa15408 -- pihole_manager/database_core.py tests/test_database.py

      - name: Apply versioned migrations and rollback tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pihole_manager/database_core.py')
          s = p.read_text()
          s = s.replace(
              'DATABASE_SCHEMA_VERSION = 11\n',
              'DATABASE_SCHEMA_VERSION = 11\nLEGACY_SCHEMA_BASELINE_VERSION = 7\n',
              1,
          )

          old = '''        _migrate_staging_table(connection)\n        _migrate_review_table(connection)\n        _migrate_classification_table(connection)\n        _migrate_research_table(connection)\n        _migrate_quota_tables(connection)\n        connection.execute(\n            """\n            INSERT INTO schema_meta(key, value) VALUES ('schema_version', ?)\n            ON CONFLICT(key) DO UPDATE SET value = excluded.value\n            """,\n            (str(DATABASE_SCHEMA_VERSION),),\n        )\n'''
          new = '''        _run_schema_migrations(connection, existing_version)\n'''
          if old not in s:
              raise SystemExit('database init migration block not found')
          s = s.replace(old, new, 1)

          runner = '''\n\ndef _set_schema_version(connection: sqlite3.Connection, version: int) -> None:\n    connection.execute(\n        """\n        INSERT INTO schema_meta(key, value) VALUES ('schema_version', ?)\n        ON CONFLICT(key) DO UPDATE SET value = excluded.value\n        """,\n        (str(version),),\n    )\n\n\ndef _run_schema_migrations(\n    connection: sqlite3.Connection,\n    existing_version: int,\n) -> None:\n    # Schema versions up to 7 predate the explicit migration registry. Treat\n    # them as one compatibility baseline and migrate forward from version 8.\n    current_version = max(existing_version, LEGACY_SCHEMA_BASELINE_VERSION)\n    if current_version >= DATABASE_SCHEMA_VERSION:\n        return\n\n    for target_version in range(current_version + 1, DATABASE_SCHEMA_VERSION + 1):\n        migration = SCHEMA_MIGRATIONS.get(target_version)\n        if migration is None:\n            raise RuntimeError(\n                f"Missing database migration for schema version {target_version}."\n            )\n\n        savepoint = f"schema_migration_{target_version}"\n        connection.execute(f"SAVEPOINT {savepoint}")\n        try:\n            migration(connection)\n            _set_schema_version(connection, target_version)\n            connection.execute(f"RELEASE SAVEPOINT {savepoint}")\n        except Exception:\n            connection.execute(f"ROLLBACK TO SAVEPOINT {savepoint}")\n            connection.execute(f"RELEASE SAVEPOINT {savepoint}")\n            raise\n'''
          needle = 'def _migrate_staging_table(connection: sqlite3.Connection) -> None:\n'
          if needle not in s:
              raise SystemExit('staging migration function not found')
          s = s.replace(needle, runner + '\n\n' + needle, 1)

          registry = '''\n\ndef _migration_8(connection: sqlite3.Connection) -> None:\n    _migrate_staging_table(connection)\n\n\ndef _migration_9(connection: sqlite3.Connection) -> None:\n    _migrate_review_table(connection)\n\n\ndef _migration_10(connection: sqlite3.Connection) -> None:\n    _migrate_classification_table(connection)\n    _migrate_research_table(connection)\n\n\ndef _migration_11(connection: sqlite3.Connection) -> None:\n    _migrate_quota_tables(connection)\n\n\nSCHEMA_MIGRATIONS = {\n    8: _migration_8,\n    9: _migration_9,\n    10: _migration_10,\n    11: _migration_11,\n}\n'''
          normalize = '\n\ndef _normalize_domain(domain: str) -> str:\n'
          if normalize not in s:
              raise SystemExit('normalization boundary not found')
          s = s.replace(normalize, registry + normalize, 1)
          p.write_text(s)

          p = Path('tests/test_database.py')
          t = p.read_text()
          old = '''    row = staging_list()[0]\n    assert row["pool_id"] == "background"\n    assert row["available_at"] == 0\n\n\ndef test_review_fields_remain_separate'''
          new = '''    row = staging_list()[0]\n    assert row["pool_id"] == "background"\n    assert row["available_at"] == 0\n\n    connection = sqlite3.connect(tmp_path / "pihole_manager.sqlite3")\n    version = connection.execute(\n        "SELECT value FROM schema_meta WHERE key = 'schema_version'"\n    ).fetchone()[0]\n    connection.close()\n    assert version == "11"\n\n\ndef test_schema_migration_rolls_back_on_failure(monkeypatch, tmp_path) -> None:\n    import sqlite3\n\n    import pytest\n\n    import pihole_manager.database_core as database_core\n\n    monkeypatch.setenv("PIHOLE_MANAGER_HOME", str(tmp_path))\n    init_db()\n\n    database = tmp_path / "pihole_manager.sqlite3"\n    connection = sqlite3.connect(database)\n    connection.execute(\n        "UPDATE schema_meta SET value = '10' WHERE key = 'schema_version'"\n    )\n    connection.commit()\n    connection.close()\n\n    def failing_migration(connection):\n        connection.execute("CREATE TABLE migration_should_rollback (id INTEGER)")\n        raise RuntimeError("simulated migration failure")\n\n    monkeypatch.setitem(database_core.SCHEMA_MIGRATIONS, 11, failing_migration)\n\n    with pytest.raises(RuntimeError, match="simulated migration failure"):\n        init_db()\n\n    connection = sqlite3.connect(database)\n    version = connection.execute(\n        "SELECT value FROM schema_meta WHERE key = 'schema_version'"\n    ).fetchone()[0]\n    table = connection.execute(\n        "SELECT name FROM sqlite_master WHERE type = 'table' AND name = ?",\n        ("migration_should_rollback",),\n    ).fetchone()\n    connection.close()\n\n    assert version == "10"\n    assert table is None\n\n\ndef test_review_fields_remain_separate'''
          if old not in t:
              raise SystemExit('legacy migration test boundary not found')
          t = t.replace(old, new, 1)
          p.write_text(t)

          roadmap = Path('docs/ROADMAP.md')
          r = roadmap.read_text()
          r = r.replace(
              '- versioned SQLite migrations with rollback tests',
              '- [x] versioned SQLite migrations with rollback tests',
              1,
          )
          roadmap.write_text(r)
          PY

      - name: Syntax check
        run: python -m compileall -q pihole_manager tests/test_database.py

      - name: Commit recovered changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pihole_manager/database_core.py tests/test_database.py docs/ROADMAP.md
          git diff --cached --check
          git commit -m "Add versioned SQLite migrations with rollback safety"
          git push
