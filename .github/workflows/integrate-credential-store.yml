name: Integrate OS credential store

on:
  push:
    branches:
      - codex/llm-analysis-profiles-20260731

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch configuration and packaging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pihole_manager/config.py')
          s = p.read_text()
          old = 'from pihole_manager.models import AutomationMode, Policy\n'
          new = 'from pihole_manager.credentials import hydrate_credentials, secure_options_payload\nfrom pihole_manager.models import AutomationMode, Policy\n'
          if old not in s:
              raise SystemExit('config import boundary not found')
          s = s.replace(old, new, 1)

          old = '''            return _validate(options)\n        except UnsupportedConfigVersionError:\n'''
          new = '''            options = _validate(options)\n            if hydrate_credentials(options):\n                save_options(options)\n            return options\n        except UnsupportedConfigVersionError:\n'''
          if old not in s:
              raise SystemExit('load_options return boundary not found')
          s = s.replace(old, new, 1)

          old = '''    payload = json.dumps(asdict(options), indent=2, ensure_ascii=False) + "\\n"\n'''
          new = '''    payload = json.dumps(\n        secure_options_payload(options),\n        indent=2,\n        ensure_ascii=False,\n    ) + "\\n"\n'''
          if old not in s:
              raise SystemExit('save_options payload boundary not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('pyproject.toml')
          s = p.read_text()
          old = '  "cryptography>=48.0.1,<49",\n'
          new = old + '  "keyring>=25,<26",\n'
          if old not in s:
              raise SystemExit('dependency boundary not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('Pi-Hole-Manager.spec')
          s = p.read_text()
          old = 'from pathlib import Path\n'
          new = old + '\nfrom PyInstaller.utils.hooks import collect_submodules\n'
          if old not in s:
              raise SystemExit('spec import boundary not found')
          s = s.replace(old, new, 1)
          old = '    hiddenimports=[],\n'
          new = '    hiddenimports=collect_submodules("keyring.backends"),\n'
          if old not in s:
              raise SystemExit('spec hiddenimports boundary not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('docs/ROADMAP.md')
          s = p.read_text()
          s = s.replace(
              '- operating-system credential stores',
              '- [x] operating-system credential stores',
              1,
          )
          p.write_text(s)
          PY

      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q pihole_manager tests
          pytest tests/test_credentials.py tests/test_config.py

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/integrate-credential-store.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pihole_manager/config.py pihole_manager/credentials.py tests/test_credentials.py pyproject.toml Pi-Hole-Manager.spec docs/ROADMAP.md
          git diff --cached --check
          git commit -m "Store application secrets in OS credential store"
          git push
